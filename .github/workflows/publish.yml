name: Publish Package
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      # Install dependencies inside the package directory
      # We remove package-lock.json to ensure platform-specific optional dependencies (Rollup) are resolved correctly for Linux
      - run: rm -f package-lock.json
        working-directory: ./packages/flexchartjs
      
      - run: npm install
        working-directory: ./packages/flexchartjs


      
      # Build the package
      - run: npm run build
        working-directory: ./packages/flexchartjs

      # Publish the package
      - run: npm publish --provenance --access public
        working-directory: ./packages/flexchartjs
        env:
          # If using Trusted Publishing, this token is not strictly needed, 
          # but keeping it allows for fallback to standard token auth if OIDC isn't set up yet.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
