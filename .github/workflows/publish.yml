name: Publish Package
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      # Install dependencies in the root (assuming workspace or root lockfile)
      # Fix for Rollup optional dependency issue on Linux CI
      - run: rm -f package-lock.json && rm -f packages/flexchartjs/package-lock.json
      - run: npm install

      
      # Build the package
      - run: npm run build
        working-directory: ./packages/flexchartjs

      # Publish the package
      - run: npm publish --provenance --access public
        working-directory: ./packages/flexchartjs
        env:
          # If using Trusted Publishing, this token is not strictly needed, 
          # but keeping it allows for fallback to standard token auth if OIDC isn't set up yet.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
